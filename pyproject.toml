[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appimagectl"
version = "0.2.0"
description = "Install, uninstall, inspect, update and clean AppImages with safe desktop integration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "appimagectl contributors" }]
keywords = ["appimage", "desktop", "linux", "gtk4", "libadwaita", "xdg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: System :: Installation/Setup",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
gui = ["PyGObject>=3.46"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/0xharryriddle/appimagectl"
Issues = "https://github.com/0xharryriddle/appimagectl/issues"

[project.scripts]
appimagectl = "appimagectl.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"